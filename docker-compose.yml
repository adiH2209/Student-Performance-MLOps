services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: student
      POSTGRES_PASSWORD: studentpass
      POSTGRES_DB: student_performance
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U student -d student_performance"]
      interval: 5s
      timeout: 5s
      retries: 10

  airflow-db:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflowpass
      POSTGRES_DB: airflow
    volumes: ["airflow_db_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  airflow-init:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    depends_on:
      airflow-db:
        condition: service_healthy
    environment: &airflow-env
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflowpass@airflow-db:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__WEBSERVER__SECRET_KEY: change-this-secret-key
      DATABASE_URL: postgresql+psycopg2://student:studentpass@postgres:5432/student_performance
    command: db migrate
    volumes: [&airflow-volumes "./:/opt/airflow/project", "./dags:/opt/airflow/dags"]

  airflow-webserver:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    environment: *airflow-env
    command: webserver
    ports: ["8080:8080"]
    volumes: ["./:/opt/airflow/project", "./dags:/opt/airflow/dags"]

  airflow-scheduler:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    environment: *airflow-env
    command: scheduler
    volumes: ["./:/opt/airflow/project", "./dags:/opt/airflow/dags"]

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg2://student:studentpass@postgres:5432/student_performance
    depends_on:
      postgres:
        condition: service_healthy
    ports: ["8000:8000"]
    profiles: ["app"]

  dashboard:
    build: .
    command: streamlit run dashboard.py --server.address 0.0.0.0
    environment:
      DATABASE_URL: postgresql+psycopg2://student:studentpass@postgres:5432/student_performance
    depends_on:
      postgres:
        condition: service_healthy
    ports: ["8501:8501"]
    profiles: ["app"]

volumes:
  postgres_data:
  airflow_db_data:
